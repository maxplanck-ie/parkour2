# Public demo instance on Fly.io.
#
# DEPLOYS RUN IN CI, NOT BY HAND. `.github/workflows/demo-deploy.yml` is the
# deploy path: it fires on every published GitHub Release (and on manual
# workflow_dispatch, which always resolves the latest release), builds the
# fixture data into a pg_dump snapshot on a throwaway CI Postgres, bakes that
# snapshot into the pk2_demo image, and deploys with this config. `make
# fly-deploy` is retired -- a local build cannot produce the baked-in
# backend/fixtures_snapshot.dump that pk2_demo copies and that the hourly
# reset restores from.
#
# Hourly reset ships as this app's own "reset" process (see [processes]
# below), not a separate `flyctl machine run --schedule=hourly` Machine
# outside this fly.toml's process groups. That used to require a manual
# `flyctl machine update` after every deploy, because `flyctl deploy` only
# touches machines in its own [processes] -- an out-of-band Machine silently
# kept running whatever image it was created with (this is what caused the
# demo DB staying empty: see git history). Being an in-image process now
# means every deploy updates it for free, same as `app`.
#
# See the routing/DNS side of this in the separate `flights` repo (omics.dev's
# gw gateway, Porkbun DNS, tinyauth exemption) -- flights/parkour/README.md.
#
# Before first deploy (one-time):
#   1. flyctl apps create parkour-demo
#   2. Create a Neon project, set its connection string:
#      flyctl secrets set -a parkour-demo DATABASE_URL='postgres://...'
#   3. flyctl secrets set -a parkour-demo SECRET_KEY="$(openssl rand -hex 32)"
#   4. Create the FLY_API_TOKEN GitHub Actions secret the workflow needs:
#      flyctl tokens create deploy -a parkour-demo
#      ...then run .github/workflows/demo-deploy.yml (workflow_dispatch) for
#      the first deploy. [deploy] release_command below runs `migrate`, and
#      demo data comes from the image's baked-in snapshot via the hourly
#      `reset_demo` (run it once by hand to seed immediately) -- there is no
#      manual `load_initial_data` step any more.
#   5. Allocate a Flycast private IP so gw can reach it (not automatic just
#      from [http_service] -- see flights AGENTS.md's Flycast checklist):
#      flyctl ips allocate-v6 --private -a parkour-demo
#   6. Wire the gw/Caddyfile routing block + Porkbun DNS + cert for
#      parkour.omics.dev, ungated (see flights repo's cal.omics.dev /
#      meet.omics.dev two-hostname precedent for the "public, no tinyauth"
#      shape -- this app only ever needs the one, ungated, hostname).
#
# One-time cleanup when adopting the in-image "reset" process on an
# already-deployed app: destroy the old standalone scheduled Machine so it
# doesn't double-reset the DB alongside the new one --
#   flyctl machine list -a parkour-demo         # find its ID
#   flyctl machine destroy <MACHINE_ID> -a parkour-demo

app = 'parkour-demo'
primary_region = 'fra'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  dockerfile = '../backend.Dockerfile'
  build-target = 'pk2_demo'

  [build.args]
    VITE_GOATCOUNTER_URL = 'https://pk2demo.stats.omics.dev/count'

[deploy]
  release_command = 'python manage.py migrate'

[env]
  CSRF_TRUSTED_ORIGINS = 'https://parkour.omics.dev'
  # DATABASE_URL (Neon) and SECRET_KEY are Fly secrets, not set here.

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512'

[processes]
  # shared-cpu-1x/512MB can't usefully run pk2_demo's Dockerfile-default
  # --workers=4 --threads=6 (sized for real prod hardware) -- each gunicorn
  # worker is a separate process with its own full Django import, so 4 of
  # them risks OOM on a machine this small. [::] (not the Dockerfile
  # default 0.0.0.0) because Fly's 6PN/Flycast is IPv6-only; see AGENTS.md's
  # Flycast checklist in the flights repo (vwd hit the same gotcha).
  app = 'gunicorn config.wsgi:application --bind=[::]:8000 --name=pk2 --timeout=600 --worker-class=gthread --worker-tmp-dir=/dev/shm --workers=1 --threads=4'
  # Hourly self-reset, running as one of this app's own machines (see the
  # header comment above) instead of an out-of-band scheduled Machine.
  # pk2_demo's base image (python:3.12-bookworm) has no cron daemon, and
  # installing one just for a single fixed interval is unwarranted -- a
  # plain sh/sleep loop needs no extra dependency and is exactly as
  # reliable here. Sleeps first so a fresh deploy doesn't immediately
  # flush-and-restore data that collectstatic/migrate/release_command just
  # finished setting up. `|| true` keeps one failed reset from crash-looping
  # the whole Machine; the next attempt an hour later gets a fresh try.
  #
  # Cost tradeoff vs. the old scheduled Machine: this "reset" process isn't
  # listed in [http_service], so it never autostops -- it's a second
  # shared-cpu-1x/512MB machine running continuously (idle/sleeping most of
  # the time), instead of a Machine Fly's scheduler started for seconds
  # once an hour. Traded that small extra always-on cost for no more
  # manual per-deploy image sync.
  reset = 'sh -c "while true; do sleep 3600; python manage.py reset_demo || true; done"'

[http_service]
  internal_port = 8000
  # NOT force_https -- flyproxy applies it to Flycast (internal) traffic
  # too, breaking gw's plain-http reverse_proxy to *.flycast. See flights
  # repo's AGENTS.md Flycast checklist.
  auto_stop_machines = true
  auto_start_machines = true
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    # DEMO_MODE auto-login (common.middleware.DemoAutoLoginMiddleware) hits
    # the DB on every request, so use a real authenticated page, not just a
    # 200-on-anything path.
    grace_period = '20s'
    method = 'GET'
    path = '/vue/'
