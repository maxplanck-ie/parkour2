{% extends "base.html" %}
{% load static %}

{% block css %}
<style>
    body {
        background:
            linear-gradient(rgba(5, 24, 28, 0.58), rgba(5, 24, 28, 0.58)),
            url("{% static 'images/error-page-background.jpg' %}") no-repeat center center fixed;
        background-size: cover;
    }
</style>
{% endblock css %}

{% block title %}Parkour LIMS | Access Denied{% endblock title %}

{% block content %}
<main class="error-page">
    <section class="error-card">
        <img class="error-logo" src="{% static 'images/parkour-logo.svg' %}" width="42" height="42" alt="">
        <div class="error-code">403</div>
        <h1>Access denied</h1>
        <p>You do not have permission to access this page or perform this action.</p>
        <a class="django-button django-button-primary" href="{% url 'index' %}">Return home</a>
    </section>
</main>
{% endblock content %}
