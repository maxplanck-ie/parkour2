<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/icons/parkour_16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/icons/parkour_32x32.png">
  <title>Parkour LIMS</title>
</head>

<body>
  <div id="app"></div>
  <!-- Self-hosted GoatCounter analytics. VITE_GOATCOUNTER_URL is per-deployment
       (misc/parkour.env for docker-compose envs, fly.toml [build.args] for the
       Fly demo); count.js no-ops when data-goatcounter is empty, so this is
       safe to leave unset (e.g. local dev). -->
  <script data-goatcounter="%VITE_GOATCOUNTER_URL%" async src="//gc.zgo.at/count.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
