name: Frontend

on:
  workflow_run:
    workflows:
      - Update
    types:
      - completed
  workflow_dispatch:
  push:
    branches: [develop, update/dependencies]
  pull_request:
    branches: [develop, update/dependencies]
    types: [opened, synchronize, reopened, ready_for_review]


jobs:
  test-and-report:
    if: github.repository == 'maxplanck-ie/parkour2'
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('backend.Dockerfile', 'frontend.Dockerfile', 'backend/requirements/**', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Playwright rule
        run: |
          make playwright
      - name: Dump backend logs on failure
        if: failure()
        run: |
          docker compose logs parkour2-django
      - name: Move Docker build cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-suite-report
          # if-no-files-found: ignore  ## default: warn
          path: |
            backend/frontend_testing_suite/videos/
            backend/frontend_testing_suite/results/
          retention-days: 30
