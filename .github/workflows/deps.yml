name: Update

on:
  workflow_dispatch:
  schedule:
    # Every Monday, 7:30 AM (Berlin)
    - cron: "30 5 * * 1"

# Artifacts' retention is 5 days, and stalebot.yml marks as stale and closes PRs after 3+2 days
# These jobs are re-run weekly anyway, so if PRs are unnattended the package.json and requirements.txt
# files will receive same updates again in a week.

jobs:
  python:
    env:
      UV_SYSTEM_PYTHON: 1
    if: github.repository == 'maxplanck-ie/parkour2'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.10', 3.11, 3.12, 3.13]
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up UV for py ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/requirements/**/*.txt"

      - name: Backend Update
        run: |
          export this=backend/requirements/${{ matrix.python-version }}
          mkdir -p $this
          uv pip compile --upgrade --quiet --no-progress --universal --python-version ${{ matrix.python-version }} \
            backend/requirements/base.in -o ${this}/base.txt
          uv pip compile --upgrade --quiet --no-progress --universal --python-version ${{ matrix.python-version }} \
            backend/requirements/dev.in -c ${this}/base.txt -o ${this}/dev.txt
          uv pip compile --upgrade --quiet --no-progress --universal --python-version ${{ matrix.python-version }} \
            backend/requirements/testing.in -c ${this}/dev.txt -o ${this}/testing.txt
      
      - name: Test installation
        run: uv pip install -r backend/requirements/${{ matrix.python-version }}/testing.txt

      - name: Upload Python requirements
        uses: actions/upload-artifact@v7
        with:
          name: python-requirements-${{ matrix.python-version }}
          path: backend/requirements/${{ matrix.python-version }}
          retention-days: 5

  vuejs:
    if: github.repository == 'maxplanck-ie/parkour2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Frontend Update
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/package.json'

      - run: npm install -g npm-check-updates
      - run: cd frontend && ncu \!ag-grid-* -u

      - name: Upload VueJS package.json
        uses: actions/upload-artifact@v7
        with:
          name: package-json
          path: frontend/package.json
          retention-days: 5

  docker-pins:
    if: github.repository == 'maxplanck-ie/parkour2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bump pinned uv version in backend.Dockerfile
        run: |
          latest=$(curl -fsSL https://api.github.com/repos/astral-sh/uv/releases/latest | jq -r .tag_name)
          sed -i -E "s|(ghcr\.io/astral-sh/uv:)[0-9.]+|\1${latest}|" backend.Dockerfile
          grep astral-sh/uv backend.Dockerfile

      - name: Bump caddy/nginx majors, warn on new postgres major
        run: |
          touch pr-note.md
          tag_exists() {  # library image, tag
            curl -fsSL "https://hub.docker.com/v2/repositories/library/$1/tags/$2" >/dev/null 2>&1
          }
          bump_major() {  # image, file
            local cur next
            cur=$(grep -oE "image: $1:[0-9]+" "$2" | grep -oE '[0-9]+$')
            next=$((cur + 1))
            if tag_exists "$1" "$next"; then
              sed -i "s|image: $1:$cur|image: $1:$next|" "$2"
              echo "- Docker: bumped \`$1\` major $cur -> $next in \`$2\`" >> pr-note.md
            fi
          }
          bump_major caddy misc/caddy.yml
          bump_major nginx misc/nginx.yml
          # postgres: never auto-bump; a new major can't start on the old pgdb volume
          pgcur=$(grep -oE 'image: postgres:[0-9]+' docker-compose.yml | grep -oE '[0-9]+$')
          if tag_exists postgres "$((pgcur + 1))"; then
            echo "- :warning: **postgres $((pgcur + 1)) is available** (pinned: $pgcur). Upgrading requires a dump/restore or pg_upgrade of the \`pgdb\` volume; update \`docker-compose.yml\` and \`misc/convert-backup.yml\` manually." >> pr-note.md
          fi
          cat pr-note.md

      - name: Upload docker pins
        uses: actions/upload-artifact@v7
        with:
          name: docker-pins
          path: |
            backend.Dockerfile
            misc/caddy.yml
            misc/nginx.yml
            pr-note.md
          retention-days: 5

  gh-action-pins:
    if: github.repository == 'maxplanck-ie/parkour2'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Bump GitHub Action majors in workflow files
        run: |
          touch pr-note-actions.md
          grep -hoE 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@v[0-9.]+' .github/workflows/*.yml | sort -u \
          | while read -r _ ref; do
              repo=${ref%@*}; cur=${ref##*@}
              cur_major=$(echo "$cur" | grep -oE '[0-9]+' | head -1)
              latest_tag=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null) || continue
              latest_major=$(echo "$latest_tag" | grep -oE '[0-9]+' | head -1)
              [ -n "$latest_major" ] && [ "$latest_major" -gt "$cur_major" ] || continue
              # prefer the floating major tag; not all actions publish one (e.g. setup-uv)
              target="v$latest_major"
              gh api "repos/$repo/git/ref/tags/$target" >/dev/null 2>&1 || target="$latest_tag"
              sed -i "s|uses: $repo@$cur|uses: $repo@$target|g" .github/workflows/*.yml
              echo "- CI: bumped \`$repo\` $cur -> $target" >> pr-note-actions.md
            done
          cat pr-note-actions.md

      - name: Upload workflow files
        uses: actions/upload-artifact@v7
        with:
          name: gh-action-pins
          path: |
            .github/workflows
            pr-note-actions.md
          retention-days: 5

  create-pr:
    needs: [python, vuejs, docker-pins, gh-action-pins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        
      - name: Download VueJS package.json
        uses: actions/download-artifact@v8
        with:
          name: package-json
          path: frontend/
      
      - name: Download docker pins
        uses: actions/download-artifact@v8
        with:
          name: docker-pins
          path: .

      - name: Download workflow files
        uses: actions/download-artifact@v8
        with:
          name: gh-action-pins
          path: .

      - name: Compose PR body
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Update all frontend and backend dependencies.

          - Backend: Updated Python dependencies for all supported versions
          - Frontend: Updated Node.js dependencies
          - Docker: Bumped pinned uv version in backend.Dockerfile
          EOF
          cat pr-note.md pr-note-actions.md >> "$RUNNER_TEMP/pr-body.md"
          rm pr-note.md pr-note-actions.md

      - name: Download Python requirements
        uses: actions/download-artifact@v8
        with:
          pattern: python-requirements-*
          path: temp/

      - name: Move Python requirements to correct location
        run: |
          for version in $(find temp/ -maxdepth 1 -type d -name "python-requirements-*" | sed 's/.*python-requirements-//'); do
            mkdir -p backend/requirements/${version}
            mv temp/python-requirements-${version}/* backend/requirements/${version}/
          done

      - name: Create Combined PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          branch: update/dependencies
          title: Update dependencies
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true
          labels: |
            Dependencies
          commit-message: |
            Update all dependencies
            
            - Backend: Run of `uv pip compile` to update all python dependencies
            - Frontend: Run of `npm-check-updates` to update all node dependencies
